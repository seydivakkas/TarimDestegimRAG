[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "tarim-destek-rag"
version = "0.1.0"
description = "Türkiye Bitkisel Üretim Destekleri için Kaynaklı Uygunluk ve Başvuru Asistanı"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "Özel Lisans - Tüm Hakları Saklıdır (c) 2026 Seydi Eryılmaz" }
authors = [
    { name = "Seydi Eryılmaz", email = "seydivakkas@users.noreply.github.com" }
]
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.32.0",
    "pydantic>=2.9.0",
    "pydantic-settings>=2.5.0",
    "sqlalchemy>=2.0.35",
    "cryptography>=43.0.0",
    "PyJWT[crypto]>=2.9,<3",
    "boto3>=1.35,<2",
    "httpx>=0.27.2",
    "beautifulsoup4>=4.12.3",
    "pypdf>=5.0.0",
    "pyyaml>=6.0.2",
    "sentence-transformers>=3.1.0",
    "faiss-cpu>=1.8.0",
    "gradio>=4.44.0",
    "rank-bm25>=0.2.2",
]

[project.optional-dependencies]
production = [
    "psycopg[binary]>=3.2,<4",
]
dev = [
    "pytest>=8.3.0",
    "pytest-cov>=5.0.0",
    "pytest-asyncio>=0.24.0",
    "ruff>=0.6.9",
    "mypy>=1.11.2",
]

[tool.hatch.build.targets.wheel]
packages = ["backend/src/tarim_destek_rag"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "W", "UP"]
ignore = ["E501"]

[tool.mypy]
python_version = "3.12"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = false
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["backend/tests"]
pythonpath = ["backend/src", "."]
addopts = "--basetemp=.pytest_temp"
