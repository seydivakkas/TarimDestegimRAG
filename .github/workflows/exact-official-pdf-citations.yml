name: Exact Official PDF Citation Gate

on:
  push:
    branches:
      - fix/exact-official-pdf-citations
      - integration/p0-security-and-original-pdf-citations
  pull_request:
    branches:
      - main
      - fix/p0-01-05-fail-closed-security-2026-10-10
  workflow_dispatch:

permissions:
  contents: read
  actions: read

# A green offline suite never substitutes for verified original government bytes.
# Both jobs are required for the workflow to pass.
jobs:
  offline-code-regressions:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      TARIM_RAG_LEGAL_ACTIVATION_ENABLED: "false"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install project and exact PDF layout dependencies
        run: python -m pip install -e ".[dev,pdf-evidence]"
      - name: Check modified source and tests
        run: |
          ruff check backend/src/tarim_destek_rag/citations/evidence_contract.py backend/src/tarim_destek_rag/citations/claim_coverage.py backend/src/tarim_destek_rag/citations/claim_source_matrix.py backend/tests/unit/test_source_bound_evidence_contract_and_report.py backend/tests/unit/test_claim_coverage_audit.py backend/tests/unit/test_p0_10_7_claim_source_matrix.py backend/src/tarim_destek_rag/citations/exact_index.py backend/src/tarim_destek_rag/citations/visual_pdf.py backend/src/tarim_destek_rag/citations/basin_visual.py backend/src/tarim_destek_rag/citations/original_html.py backend/src/tarim_destek_rag/api/schemas.py backend/src/tarim_destek_rag/api/main.py frontend_pc/formatters.py backend/src/tarim_destek_rag/citations/document_links.py backend/src/tarim_destek_rag/explainer/template_explainer.py backend/tests/unit/test_exact_official_pdf_citations.py backend/tests/unit/test_8859_scanned_original_highlighting.py backend/tests/unit/test_basin_original_pdf_evidence.py backend/tests/unit/test_exact_original_html_clause.py backend/tests/unit/test_document_links.py frontend_pc/pages/support_analysis.py
          python -m compileall -q backend/src/tarim_destek_rag/citations/evidence_contract.py backend/src/tarim_destek_rag/citations/claim_coverage.py backend/src/tarim_destek_rag/citations/claim_source_matrix.py backend/src/tarim_destek_rag/citations/exact_index.py backend/src/tarim_destek_rag/citations/document_links.py backend/src/tarim_destek_rag/explainer/template_explainer.py frontend_pc/pages/support_analysis.py frontend_pc/formatters.py backend/src/tarim_destek_rag/citations/basin_visual.py backend/src/tarim_destek_rag/api/main.py backend/src/tarim_destek_rag/api/schemas.py
      - name: Offline evidence regression (live-source cases report SKIPPED)
        run: python -m pytest -q -rs --no-cov backend/tests/unit/test_source_bound_evidence_contract_and_report.py backend/tests/unit/test_claim_coverage_audit.py backend/tests/unit/test_p0_10_7_claim_source_matrix.py backend/tests/unit/test_exact_official_pdf_citations.py backend/tests/unit/test_basin_original_pdf_evidence.py backend/tests/unit/test_8859_scanned_original_highlighting.py backend/tests/unit/test_exact_original_html_clause.py backend/tests/unit/test_document_links.py backend/tests/unit/test_p11_p14_retrieval_and_explainer.py backend/tests/integration/test_p16_frontend_pc.py
      - name: Full backend regression
        run: python -m pytest -q --no-cov backend/tests
  exact-evidence:
    # Keep this required job name stable for branch-protection check rules.
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      TARIM_RAG_LEGAL_ACTIVATION_ENABLED: "false"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install project and exact PDF layout dependencies
        run: python -m pip install -e ".[dev,pdf-evidence]"
      - name: Restore independently SHA-audited 2024/2025 Gazette originals
        uses: actions/download-artifact@v4
        continue-on-error: true
        with:
          name: p0-10-3-original-official-bytes
          run-id: 37907432091
          github-token: ${{ github.token }}
          path: data/legal_update_archive
      - name: Verify recovered original source bytes before dependent tools
        run: |
          python -c "from pathlib import Path; import hashlib; root=Path('data/legal_update_archive/originals'); pins=[('89df0b6222edb4eddf3d5f588a4007061458adec8d518e3fbdb86b46ae5ba85f','.pdf',1436150),('efb1ebea650cf836155728b6bd3599b76a0fbee70d1a8e5c85f2af4792734530','.html',236810)]; present=[(s,e,n) for s,e,n in pins if (root/(s+e)).is_file()]; [(lambda p,s,n: (_ for _ in ()).throw(ValueError('Pinned archive digest/size mismatch')) if len(p.read_bytes())!=n or hashlib.sha256(p.read_bytes()).hexdigest()!=s else None)(root/(s+e),s,n) for s,e,n in present]; print('Prior audited originals restored and SHA checked:',len(present),'of',len(pins))"
      - name: Install original 8859 scanned Gazette PDF and verify pinned source bytes
        run: python -m tarim_destek_rag.citations.visual_pdf --install-8859
      - name: Restore SHA-pinned original Gazette HTML cache
        uses: actions/cache@v4
        with:
          path: data/legal_update_archive/originals/efb1ebea650cf836155728b6bd3599b76a0fbee70d1a8e5c85f2af4792734530.html
          key: official-rg-2024-39-efb1ebea650cf836155728b6bd3599b76a0fbee70d1a8e5c85f2af4792734530-v1
      - name: Install original 2024/39 Resmî Gazete HTML and verify pinned source bytes
        run: python -m tarim_destek_rag.citations.original_html --install
      - name: Verify MADDE 4(1) is a true exact original HTML clause
        run: |
          python -c "from tarim_destek_rag.citations.original_html import lookup_html_clause as f; p=f('BASIC_SUPPORT_2026'); assert p and p['section']=='MADDE 4 (1)'"
      - name: Install and SHA-verify original 81-page official district/crop PDF
        run: python -m tarim_destek_rag.citations.basin_visual --install
      - name: Enforce original Ministry district and product source on real PDF
        run: |
          python -c "from tarim_destek_rag.citations.basin_visual import lookup_basin_crop_evidence as f; p=f('KONYA','KARATAY','BUĞDAY',2026); assert p and p['page_number']==53 and p['eligible'] is None"
      - name: Test exact source and legacy frontend behavior
        run: python -m pytest -q --no-cov backend/tests/unit/test_source_bound_evidence_contract_and_report.py backend/tests/unit/test_claim_coverage_audit.py backend/tests/unit/test_p0_10_7_claim_source_matrix.py backend/tests/unit/test_exact_official_pdf_citations.py backend/tests/unit/test_basin_original_pdf_evidence.py backend/tests/unit/test_8859_scanned_original_highlighting.py backend/tests/unit/test_exact_original_html_clause.py backend/tests/unit/test_document_links.py backend/tests/unit/test_p11_p14_retrieval_and_explainer.py backend/tests/integration/test_p16_frontend_pc.py
      - name: Explain unavailable official original is HOLD
        if: failure()
        run: |
          echo "### Original-source evidence HOLD" >> "$GITHUB_STEP_SUMMARY"
          echo "This run could not verify all pinned official originals. Offline tests may pass, but original HTML/PDF, visual placement and legal sign-off are **not accepted**." >> "$GITHUB_STEP_SUMMARY"
