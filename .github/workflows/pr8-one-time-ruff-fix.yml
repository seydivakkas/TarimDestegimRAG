name: One-time PR8 Ruff Safe Fixes
on:
  push:
    branches:
      - fix/p0-data-reliability-2026-10-08
    paths:
      - .github/workflows/pr8-one-time-ruff-fix.yml

permissions:
  contents: write

jobs:
  autoformat-legacy-imports:
    if: github.repository == 'seydivakkas/TarimDestegimRAG' && github.ref == 'refs/heads/fix/p0-data-reliability-2026-10-08'
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install Ruff (same release family as normal CI)
        run: python -m pip install ruff
      - name: Apply safe, deterministic Ruff rules only
        run: |
          # Ruff safe fixes are persisted even when unrelated manual
          # violations remain; mandatory CI lint stays strict and unmodified.
          ruff check --fix backend/src backend/tests || true
          ruff check backend/src backend/tests || true
      - name: Commit only code-format/import corrections to this PR branch
        run: |
          if ! git diff --quiet -- backend/src backend/tests; then
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git add backend/src backend/tests
            git commit -m 'style(pr8): apply safe Ruff lint fixes without suppressions'
            git push origin HEAD:fix/p0-data-reliability-2026-10-08
          fi
