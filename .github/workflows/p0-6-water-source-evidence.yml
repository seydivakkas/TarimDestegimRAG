name: 2026 Water Legal Primary Source Evidence

on:
  pull_request:
    paths:
      - "scripts/collect_2026_water_evidence.py"
      - "backend/src/tarim_destek_rag/normalization/water_2026.py"
      - "configs/2026_water_restriction_52_draft.json"
      - ".github/workflows/p0-6-water-source-evidence.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  original-2024-39-and-2025-42:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install PDF and statutory HTML parser
        run: python -m pip install "pypdf>=5,<7" "beautifulsoup4>=4.12,<5"
      - name: Hash exact law source bytes and check changed legal clauses
        env:
          PYTHONPATH: "backend/src:."
        run: python scripts/collect_2026_water_evidence.py
      - name: Preserve immutable inputs and manifest for legal human review
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: official-water-law-2026-source-bits
          path: data/water_legal_evidence_2026/
          if-no-files-found: warn
