name: 2026 Primary Gazette PDF Evidence

on:
  pull_request:
    paths:
      - "scripts/collect_2026_legal_evidence.py"
      - ".github/workflows/legal-primary-evidence.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  primary-pdf-byte-provenance:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install PDF parser
        run: python -m pip install "pypdf>=5,<7"
      - name: Retrieve original primary-law PDFs and hash exact fetched bytes
        run: python scripts/collect_2026_legal_evidence.py --output-dir data/legal_evidence
      - name: Preserve evidence and errors for review
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: 2026-official-gazette-evidence
          path: data/legal_evidence/
          if-no-files-found: warn
