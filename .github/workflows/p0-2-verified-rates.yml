name: P0-2 Approved Rate Gate

on:
  pull_request:
    paths:
      - "backend/src/tarim_destek_rag/database/**"
      - "backend/src/tarim_destek_rag/rules/**"
      - "backend/src/tarim_destek_rag/normalization/seed_data.py"
      - "backend/src/tarim_destek_rag/api/**"
      - "backend/src/tarim_destek_rag/evaluation/**"
      - "backend/tests/unit/test_p0_2_verified_rates.py"
      - ".github/workflows/p0-2-verified-rates.yml"
  push:
    branches: [main]
    paths:
      - "backend/src/tarim_destek_rag/database/**"
      - "backend/src/tarim_destek_rag/rules/**"
      - "backend/src/tarim_destek_rag/normalization/seed_data.py"
      - "backend/tests/unit/test_p0_2_verified_rates.py"
      - ".github/workflows/p0-2-verified-rates.yml"

permissions:
  contents: read

jobs:
  verify-approval-gate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install minimal deterministic backend dependencies
        run: python -m pip install "pytest>=8,<10" "sqlalchemy>=2.0.35,<3" "pydantic>=2.9,<3" "pydantic-settings>=2.5,<3" "pyyaml>=6,<7"
      - name: Compile all touched Python code
        run: |
          python -m compileall -q backend/src/tarim_destek_rag/database
          python -m compileall -q backend/src/tarim_destek_rag/rules
          python -m compileall -q backend/src/tarim_destek_rag/normalization/seed_data.py
          python -m compileall -q backend/src/tarim_destek_rag/api
          python -m compileall -q backend/src/tarim_destek_rag/evaluation
          python -m compileall -q backend/tests/unit/test_p0_2_verified_rates.py
      - name: Run fail-closed provenance regression tests
        env:
          PYTHONPATH: backend/src
          DATABASE_URL: "sqlite:///:memory:"
        run: python -m pytest backend/tests/unit/test_p0_2_verified_rates.py -q
