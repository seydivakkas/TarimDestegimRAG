name: 2026 Legal Component Provenance and Decision Gate

on:
  pull_request:
    paths:
      - "configs/2026_documented_component_rates_draft.json"
      - "backend/src/tarim_destek_rag/normalization/legal_components_2026.py"
      - "backend/src/tarim_destek_rag/normalization/import_2026_components.py"
      - "backend/tests/unit/test_legal_components_2026.py"
      - "backend/tests/unit/test_decision_2026_matrix.py"
      - "backend/tests/unit/test_p0_2_verified_rates.py"
      - ".github/workflows/legal-components-2026.yml"
  push:
    branches: [main]
    paths:
      - "configs/2026_documented_component_rates_draft.json"
      - "backend/src/tarim_destek_rag/normalization/legal_components_2026.py"
      - "backend/tests/unit/test_legal_components_2026.py"
      - "backend/tests/unit/test_decision_2026_matrix.py"
      - ".github/workflows/legal-components-2026.yml"

permissions:
  contents: read

jobs:
  legal-golden-and-fail-closed:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install deterministic test dependencies
        run: python -m pip install "pytest>=8,<10" "sqlalchemy>=2.0.35,<3" "pydantic>=2.9,<3" "pydantic-settings>=2.5,<3" "pyyaml>=6,<7"
      - name: Compile source and tests
        run: |
          python -m compileall -q backend/src/tarim_destek_rag/normalization/legal_components_2026.py
          python -m compileall -q backend/src/tarim_destek_rag/normalization/import_2026_components.py
          python -m compileall -q backend/tests/unit/test_legal_components_2026.py
          python -m compileall -q backend/tests/unit/test_decision_2026_matrix.py
      - name: Check legal values and decision-engine exclusion
        env:
          PYTHONPATH: backend/src
          DATABASE_URL: "sqlite:///:memory:"
        run: python -m pytest backend/tests/unit/test_legal_components_2026.py backend/tests/unit/test_decision_2026_matrix.py backend/tests/unit/test_p0_2_verified_rates.py backend/tests/unit/test_p4_p5_db_and_normalization.py backend/tests/unit/test_p7_p8_p9_rules_calculator.py backend/tests/unit/test_p10_benchmark.py backend/tests/unit/test_issue2_issue3_legislative_decision_engine.py -q
