name: P0-10.3 Direct Official Byte Acquisition and Coverage HOLD

on:
  push:
    branches:
      - feat/p0-10-3-original-source-integrity
  pull_request:
    branches:
      - feat/p0-10-2-real-source-parser-fixes
  workflow_dispatch:

permissions:
  contents: read

jobs:
  unit-integrity-and-year-coverage:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install minimal audit dependencies
        run: python -m pip install "pypdf>=5,<7" "pytest>=8,<10" "ruff>=0.6.9"
      - name: Compile deterministic original-byte auditor
        run: python -m compileall -q scripts/p0_10_3_source_integrity.py backend/tests/unit/test_p0_10_3_original_source_integrity.py
      - name: Enforce Ruff
        run: ruff check scripts/p0_10_3_source_integrity.py backend/tests/unit/test_p0_10_3_original_source_integrity.py
      - name: Run fail-closed source and year regressions
        run: python -m pytest backend/tests/unit/test_p0_10_3_original_source_integrity.py -q -p no:cacheprovider

  live-original-official-byte-collection:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    env:
      TARIM_RAG_LEGAL_ACTIVATION_ENABLED: "false"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install official PDF structural verification
        run: python -m pip install "pypdf>=5,<7"
      - name: Verify all five pinned original HTTP/PDF SHA-256 and linked annex bytes (legal semantics HOLD)
        run: >-
          python scripts/p0_10_3_source_integrity.py
          --mode verify --byte-contract-only
          --out data/p0_10_3_live_originals
      - name: Archive original bytes and machine-readable report even when source unavailable
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: p0-10-3-original-official-bytes
          path: data/p0_10_3_live_originals/
          if-no-files-found: warn
          retention-days: 90
