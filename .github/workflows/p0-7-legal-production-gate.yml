name: P0-7 Officer Identity KMS and WORM Acceptance Gate

on:
  pull_request:
    paths:
      - "backend/src/tarim_destek_rag/database/**"
      - "backend/tests/unit/test_p0_7_operator_worm.py"
      - "deployment/sql/p0_7_legal_role_grants.sql"
      - ".github/workflows/p0-7-legal-production-gate.yml"
      - "pyproject.toml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  identity-vault-worm-contract:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install deterministic legal authorization dependencies
        run: |
          python -m pip install "pytest>=8,<10" "sqlalchemy>=2.0.35,<3" "pydantic>=2.9,<3" "pydantic-settings>=2.5,<3" "pyyaml>=6,<7" "cryptography>=43,<47" "httpx>=0.27,<1" "PyJWT[crypto]>=2.9,<3" "boto3>=1.35,<2"
      - name: Compile operator and audit modules
        run: |
          python -m compileall -q backend/src/tarim_destek_rag/database
          python -m compileall -q backend/tests/unit/test_p0_7_operator_worm.py
      - name: Offline identity/remote-sign/WORM lifecycle and historical guardrails
        env:
          PYTHONPATH: "backend/src:."
          DATABASE_URL: "sqlite:///:memory:"
        run: |
          python -m pytest \
            backend/tests/unit/test_p0_7_operator_worm.py \
            backend/tests/unit/test_p0_5_signed_approval.py \
            backend/tests/unit/test_p0_6_2026_water_scope.py \
            backend/tests/unit/test_p0_2_verified_rates.py \
            backend/tests/unit/test_p0_4_basin_review.py -q

  postgres-role-contract:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: "CI-only-postgres-not-production"
          POSTGRES_DB: tarim_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U postgres -d tarim_ci"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install PostgreSQL driver and ORM dependencies
        run: |
          python -m pip install "psycopg[binary]>=3.2,<4" "sqlalchemy>=2.0.35,<3" "pydantic>=2.9,<3" "pydantic-settings>=2.5,<3" "pyyaml>=6,<7" "cryptography>=43,<47"
      - name: Assert real PostgreSQL role grants and deny UPDATE/DELETE
        env:
          PYTHONPATH: "backend/src:."
          DATABASE_URL: "sqlite:///:memory:"
          P0_7_CI_POSTGRES_URL: "postgresql://postgres:CI-only-postgres-not-production@127.0.0.1:5432/tarim_ci"
        run: python deployment/tests/verify_p0_7_postgres_roles.py
