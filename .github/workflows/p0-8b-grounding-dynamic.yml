name: P0-8B Grounded PDF Page and Dynamic Year Drafts

on:
  pull_request:
    paths:
      - "backend/src/tarim_destek_rag/auto_updater/**"
      - "backend/src/tarim_destek_rag/rules/dynamic_engine.py"
      - "backend/src/tarim_destek_rag/database/models.py"
      - "backend/src/tarim_destek_rag/api/main.py"
      - "backend/tests/unit/test_p0_8b_layout_dynamic.py"
      - "deployment/sql/p0_8b_create_grounding_and_dynamic_drafts.sql"
      - "pyproject.toml"
      - ".github/workflows/p0-8b-grounding-dynamic.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  future-year-pdf-bbox-and-rate-draft:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install test-verified PDF and SQLite layers
        run: |
          python -m pip install "pytest>=8,<10" "sqlalchemy>=2.0.35,<3" "pydantic>=2.9,<3" "pydantic-settings>=2.5,<3" "pyyaml>=6,<7" "PyMuPDF>=1.25,<1.29" "Pillow>=10,<13"
      - name: Compile new source modules and API
        run: |
          python -m compileall -q backend/src/tarim_destek_rag/auto_updater
          python -m compileall -q backend/src/tarim_destek_rag/rules/dynamic_engine.py
          python -m compileall -q backend/src/tarim_destek_rag/api/main.py
          python -m compileall -q scripts/stage_pdf_evidence.py
      - name: Test synthetic 2029/2030 legal evidence and rate isolation
        env:
          PYTHONPATH: "backend/src:."
          DATABASE_URL: "sqlite:///:memory:"
        run: python -m pytest backend/tests/unit/test_p0_8b_layout_dynamic.py -q
