name: P0-8C Yearly Legal Diff and Signed Release Safety

on:
  pull_request:
    paths:
      - "backend/src/tarim_destek_rag/auto_updater/legal_diff.py"
      - "backend/src/tarim_destek_rag/auto_updater/legal_diff_repository.py"
      - "backend/src/tarim_destek_rag/auto_updater/release.py"
      - "backend/src/tarim_destek_rag/database/models.py"
      - "backend/src/tarim_destek_rag/database/legal_approvals.py"
      - "backend/src/tarim_destek_rag/database/legal_approval_cli.py"
      - "backend/src/tarim_destek_rag/database/legal_officer_cli.py"
      - "backend/src/tarim_destek_rag/api/main.py"
      - "backend/tests/unit/test_p0_8c_legal_diff.py"
      - "backend/tests/unit/test_p0_8c_signed_release.py"
      - "deployment/sql/p0_8c_legal_release_schema.sql"
      - ".github/workflows/p0-8c-legal-diff-release.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  exact-legal-diff-and-2030-release-protocol:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install deterministic legal source dependencies
        run: |
          python -m pip install "pytest>=8,<10" "sqlalchemy>=2.0.35,<3" "pydantic>=2.9,<3" "pydantic-settings>=2.5,<3" "pyyaml>=6,<7" "cryptography>=43,<47" "httpx>=0.27,<1" "PyMuPDF>=1.25,<1.29" "Pillow>=10,<13"
      - name: Compile modules and source evidence tools
        run: |
          python -m compileall -q backend/src/tarim_destek_rag/auto_updater
          python -m compileall -q backend/src/tarim_destek_rag/api/main.py
          python -m compileall -q scripts/build_legal_diff_report.py
      - name: Test future year legal diffs, signed rates and release guards
        env:
          PYTHONPATH: "backend/src:."
          DATABASE_URL: "sqlite:///:memory:"
        run: |
          python -m pytest \
            backend/tests/unit/test_p0_8c_legal_diff.py \
            backend/tests/unit/test_p0_8c_signed_release.py \
            backend/tests/unit/test_p0_8b_layout_dynamic.py -q
