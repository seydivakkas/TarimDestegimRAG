name: Official 2026 Rate Reference Validation

on:
  pull_request:
    paths:
      - "configs/official_support_reference_2026.json"
      - "backend/src/tarim_destek_rag/normalization/official_rates.py"
      - "backend/tests/unit/test_official_rate_reference_2026.py"
      - ".github/workflows/official-rate-reference.yml"
  push:
    branches: [main]
    paths:
      - "configs/official_support_reference_2026.json"
      - "backend/src/tarim_destek_rag/normalization/official_rates.py"
      - "backend/tests/unit/test_official_rate_reference_2026.py"
      - ".github/workflows/official-rate-reference.yml"

permissions:
  contents: read

jobs:
  verify-reference:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install lightweight test runner
        run: python -m pip install "pytest>=8,<10"
      - name: Compile source
        run: python -m compileall -q backend/src/tarim_destek_rag/normalization/official_rates.py
      - name: Validate published data and deny unsafe use
        env:
          PYTHONPATH: backend/src
        run: python -m pytest backend/tests/unit/test_official_rate_reference_2026.py -q
