name: P0-9 Main Integration Acceptance

on:
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  unified-legal-source-and-decision-regression:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      TOKENIZERS_PARALLELISM: "false"
      TARIM_RAG_LEGAL_ACTIVATION_ENABLED: "false"
      TARIM_RAG_LEGAL_SECURITY_PROFILE: "disabled"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install all release-scoped development and PDF proof dependencies
        run: python -m pip install -e ".[dev,pdf-evidence]"
      - name: Compile backend, main modular Gradio and updater scripts
        run: |
          python -m compileall -q backend/src frontend_pc scripts
      - name: Enforce full repository source quality
        run: ruff check backend/src backend/tests
      - name: Test 2026 P0 safety, 2030 signed release, UI and original PDF evidence together
        env:
          PYTHONPATH: "backend/src:."
        run: |
          python -m pytest backend/tests -q --no-cov \
            --junitxml=p0-9-complete-integration.xml
      - name: Upload integrated regression results even on failure
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: p0-9-main-integration-junit
          path: p0-9-complete-integration.xml
          if-no-files-found: ignore
